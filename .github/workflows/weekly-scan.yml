# CargoTrack Weekly Security Scan
# Cron-driven rescan of ALL images to catch CVEs disclosed in base images
# since the last CI run. Complements the PR-triggered scanning in ci.yml.
name: Weekly Security Scan

on:
  schedule:
    - cron: "37 3 * * 0"  # Sunday 03:37 UTC
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: services/api
            dockerfile: services/api/Dockerfile
          - name: frontend
            context: .
            dockerfile: frontends/web/Dockerfile.prod
          - name: go-tracking
            context: services/tracking-ingest
            dockerfile: services/tracking-ingest/Dockerfile
          - name: gps-ingest
            context: services/gps-ingest
            dockerfile: services/gps-ingest/Dockerfile
          - name: notification
            context: services/notification
            dockerfile: services/notification/Dockerfile
          - name: webhook-dispatcher
            context: services/webhook-dispatcher
            dockerfile: services/webhook-dispatcher/Dockerfile
          - name: workflow-engine
            context: services/workflow-engine
            dockerfile: services/workflow-engine/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (no push — scan only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cargotrack-${{ matrix.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cargotrack-${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: weekly-${{ matrix.name }}
