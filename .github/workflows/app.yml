# App (Expo: web, Android, iOS): type-check, lint, contract drift,
# dependency health, and a release-mode bundle for Android and web.
name: App

on:
  pull_request:
    branches: [main]
    paths: ["frontends/app/**", "contracts/openapi/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["frontends/app/**", "contracts/openapi/**", ".github/workflows/app.yml"]
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontends/app

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontends/app/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      # The API types are generated from the contract. If someone changes the
      # contract without regenerating, the app would be typed against a
      # different API than the core serves.
      - name: API types match the contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      # Native modules must match the Expo SDK: a mismatch is how the
      # previous app shipped a build that could not start.
      - name: Dependencies match the SDK
        run: npx expo-doctor
      - name: Release bundle (Android and web)
        run: npx expo export --platform android --platform web --output-dir dist
