# CargoTrack CI Pipeline
# PR → lint → test → build → push images → deploy staging → integration tests
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: ${{ github.repository_owner }}

jobs:
  # ── Pre-flight: detect changed services to avoid unnecessary builds ──────
  changes:
    runs-on: ubuntu-latest
    outputs:
      # These include CI config changes to always run lint+test
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outputs.ci == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      go-tracking: ${{ steps.filter.outputs.go-tracking == 'true' || steps.filter.outputs.ci == 'true' }}
      elixir-ws: ${{ steps.filter.outputs.elixir-ws }}
      gps-ingest: ${{ steps.filter.outputs.gps-ingest == 'true' || steps.filter.outputs.ci == 'true' }}
      notification: ${{ steps.filter.outputs.notification == 'true' || steps.filter.outputs.ci == 'true' }}
      webhook: ${{ steps.filter.outputs.webhook == 'true' || steps.filter.outputs.ci == 'true' }}
      workflow-engine: ${{ steps.filter.outputs.workflow-engine == 'true' || steps.filter.outputs.ci == 'true' }}
      edi: ${{ steps.filter.outputs.edi }}
      # Build-only outputs (NOT triggered by CI config changes)
      build-api: ${{ steps.filter.outputs.api }}
      build-frontend: ${{ steps.filter.outputs.frontend }}
      build-go-tracking: ${{ steps.filter.outputs.go-tracking }}
      build-gps-ingest: ${{ steps.filter.outputs.gps-ingest }}
      build-notification: ${{ steps.filter.outputs.notification }}
      build-webhook: ${{ steps.filter.outputs.webhook }}
      build-workflow-engine: ${{ steps.filter.outputs.workflow-engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api: services/api/**|.github/workflows/**
            frontend: frontends/web/**|libs/shared-types/**|.github/workflows/**
            go-tracking: services/tracking-ingest/**|.github/workflows/**
            elixir-ws: services/ws/**
            gps-ingest: services/gps-ingest/**|.github/workflows/**
            notification: services/notification/**|.github/workflows/**
            webhook: services/webhook-dispatcher/**|.github/workflows/**
            workflow-engine: services/workflow-engine/**|.github/workflows/**
            edi: services/edi-integration/**
            ci: .github/workflows/**

  # ── Lint ────────────────────────────────────────────────────────────────
  lint:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            if: ${{ needs.changes.outputs.api == 'true' }}
          - service: frontend
            if: ${{ needs.changes.outputs.frontend == 'true' }}
          - service: go-tracking
            if: ${{ needs.changes.outputs.go-tracking == 'true' }}
          - service: gps-ingest
            if: ${{ needs.changes.outputs.gps-ingest == 'true' }}
          - service: notification
            if: ${{ needs.changes.outputs.notification == 'true' }}
          - service: webhook
            if: ${{ needs.changes.outputs.webhook == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python (Django)
        if: matrix.service == 'api'
        run: |
          pip install ruff
          ruff check services/api/

      - name: Lint TypeScript
        if: matrix.service == 'frontend'
        run: |
          cd frontends/web
          npm ci
          npx eslint .

      - name: Lint Go (tracking-ingest)
        if: matrix.service == 'go-tracking'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/tracking-ingest
          args: --timeout=3m

      - name: Lint Go (notification)
        if: matrix.service == 'notification'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/notification
          args: --timeout=3m

      - name: Lint Go (webhook-dispatcher)
        if: matrix.service == 'webhook'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/webhook-dispatcher
          args: --timeout=3m

      - name: Lint Rust (clippy)
        if: matrix.service == 'gps-ingest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libsasl2-dev
          cd services/gps-ingest
          cargo clippy --all-targets

  # ── Test ────────────────────────────────────────────────────────────────
  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            if: ${{ needs.changes.outputs.api == 'true' }}
          - service: go-tracking
            if: ${{ needs.changes.outputs.go-tracking == 'true' }}
          - service: gps-ingest
            if: ${{ needs.changes.outputs.gps-ingest == 'true' }}
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: cargotrack_test
          POSTGRES_USER: cargotrack
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.service == 'api'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install Python dependencies
        if: matrix.service == 'api'
        run: pip install -r services/api/requirements.txt

      - name: Run Django migrations
        if: matrix.service == 'api'
        env:
          DEBUG: "false"
          SECRET_KEY: ci-test-key
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DB_USER: cargotrack
          DB_PASSWORD: test
          DB_NAME: cargotrack_test
          REDIS_URL: redis://localhost:6379/0
          OIDC_ENABLED: "false"
        run: |
          cd services/api
          python manage.py migrate --noinput
          python manage.py check

      - name: Run Django tests
        if: matrix.service == 'api'
        env:
          DEBUG: "false"
          SECRET_KEY: ci-test-key
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DB_USER: cargotrack
          DB_PASSWORD: test
          DB_NAME: cargotrack_test
          REDIS_URL: redis://localhost:6379/0
          OIDC_ENABLED: "false"
        run: |
          cd services/api
          pytest --tb=short -q

      - name: Run Go tests
        if: matrix.service == 'go-tracking'
        run: cd services/tracking-ingest && go test ./...

      - name: Run Rust tests
        if: matrix.service == 'gps-ingest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libsasl2-dev
          cd services/gps-ingest
          cargo test --release

  # ── Build & Push Docker images ──────────────────────────────────────────
  build:
    needs: [changes, lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: services/api
            dockerfile: services/api/Dockerfile
            if: ${{ needs.changes.outputs.build-api == 'true' }}
          - name: frontend
            context: .
            dockerfile: frontends/web/Dockerfile
            if: ${{ needs.changes.outputs.build-frontend == 'true' }}
          - name: go-tracking
            context: services/tracking-ingest
            dockerfile: services/tracking-ingest/Dockerfile
            if: ${{ needs.changes.outputs.build-go-tracking == 'true' }}
          - name: gps-ingest
            context: services/gps-ingest
            dockerfile: services/gps-ingest/Dockerfile
            if: ${{ needs.changes.outputs.build-gps-ingest == 'true' }}
          - name: notification
            context: services/notification
            dockerfile: services/notification/Dockerfile
            if: ${{ needs.changes.outputs.build-notification == 'true' }}
          - name: webhook-dispatcher
            context: services/webhook-dispatcher
            dockerfile: services/webhook-dispatcher/Dockerfile
            if: ${{ needs.changes.outputs.build-webhook == 'true' }}
          - name: workflow-engine
            context: services/workflow-engine
            dockerfile: services/workflow-engine/Dockerfile
            if: ${{ needs.changes.outputs.build-workflow-engine == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for Cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/cargotrack-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5

      - name: Sign image with Cosign
        run: |
          cosign sign --yes \
            "${REGISTRY}/${REGISTRY_OWNER}/cargotrack-${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  # ── Vulnerability Scanning (Trivy) ──────────────────────────────────────
  scan:
    needs: [build, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cargotrack-backend
            if: ${{ needs.changes.outputs.build-api == 'true' }}
          - image: cargotrack-frontend
            if: ${{ needs.changes.outputs.build-frontend == 'true' }}
          - image: cargotrack-go-tracking
            if: ${{ needs.changes.outputs.build-go-tracking == 'true' }}
          - image: cargotrack-gps-ingest
            if: ${{ needs.changes.outputs.build-gps-ingest == 'true' }}
          - image: cargotrack-notification
            if: ${{ needs.changes.outputs.build-notification == 'true' }}
          - image: cargotrack-webhook-dispatcher
            if: ${{ needs.changes.outputs.build-webhook == 'true' }}
          - image: cargotrack-workflow-engine
            if: ${{ needs.changes.outputs.build-workflow-engine == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Compute lowercase image reference
        id: ref
        run: |
          owner=$(echo "${{ env.REGISTRY_OWNER }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${owner}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}" >> $GITHUB_OUTPUT

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif

  # ── Deploy to Staging ───────────────────────────────────────────────────
  deploy-staging:
    needs: [build, scan, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.cargotrack.io
    steps:
      - uses: actions/checkout@v4

      - name: Check if KUBECONFIG_STAGING is configured
        id: check
        run: |
          if [ -n "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "KUBECONFIG_STAGING secret not set — skipping deploy"
          fi

      - name: Configure kubectl
        if: steps.check.outputs.configured == 'true'
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Deploy to staging
        if: steps.check.outputs.configured == 'true'
        env:
          BUILD_API: ${{ needs.changes.outputs.build-api }}
          BUILD_FRONTEND: ${{ needs.changes.outputs.build-frontend }}
          BUILD_GO_TRACKING: ${{ needs.changes.outputs.build-go-tracking }}
          BUILD_GPS_INGEST: ${{ needs.changes.outputs.build-gps-ingest }}
          BUILD_NOTIFICATION: ${{ needs.changes.outputs.build-notification }}
          BUILD_WEBHOOK: ${{ needs.changes.outputs.build-webhook }}
          BUILD_WORKFLOW_ENGINE: ${{ needs.changes.outputs.build-workflow-engine }}
        run: |
          export IMAGE_TAG=sha-${GITHUB_SHA::7}
          deploy() {
            local svc=$1
            if [ -f "deploy/kubernetes/services/${svc}.yaml" ]; then
              echo "Deploying ${svc}..."
              envsubst < "deploy/kubernetes/services/${svc}.yaml" | kubectl apply -f -
              kubectl rollout status "deployment/${svc}" -n cargotrack --timeout=300s || true
            fi
          }
          # Run migrations before backend deployments
          if [ "$BUILD_API" = "true" ] && [ -f "deploy/kubernetes/services/migrations.yaml" ]; then
            echo "Running database migrations..."
            kubectl delete job migrations -n cargotrack --ignore-not-found
            envsubst < deploy/kubernetes/services/migrations.yaml | kubectl apply -f -
            kubectl wait --for=condition=complete --timeout=120s job/migrations -n cargotrack || {
              echo "Migration failed — checking logs:"
              kubectl logs job/migrations -n cargotrack --tail=50
              exit 1
            }
          fi
          [ "$BUILD_API" = "true" ] && deploy backend
          [ "$BUILD_FRONTEND" = "true" ] && deploy frontend
          [ "$BUILD_GO_TRACKING" = "true" ] && deploy go-tracking
          [ "$BUILD_GPS_INGEST" = "true" ] && deploy gps-ingest
          [ "$BUILD_NOTIFICATION" = "true" ] && deploy notification
          [ "$BUILD_WEBHOOK" = "true" ] && deploy webhook-dispatcher
          [ "$BUILD_WORKFLOW_ENGINE" = "true" ] && deploy workflow-engine
