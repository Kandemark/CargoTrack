# CargoTrack — Kubernetes base configuration
# Applied first: kubectl apply -k deploy/kubernetes/base/
---
apiVersion: v1
kind: Namespace
metadata:
  name: cargotrack
  labels:
    app.kubernetes.io/part-of: cargotrack
---
# Secrets are managed via SealedSecrets.
# See: deploy/kubernetes/sealed-secrets/cargotrack-secrets.yaml
# Apply after the SealedSecrets controller is installed on the cluster.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cargotrack-config
  namespace: cargotrack
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  DB_HOST: "postgres.cargotrack.svc.cluster.local"
  DB_NAME: "cargotrack"
  DB_USER: "cargotrack"
  OIDC_ENABLED: "true"
  KEYCLOAK_SERVER_URL: "https://auth.cargotrack.io"
  KEYCLOAK_REALM: "cargotrack"
  KEYCLOAK_CLIENT_ID: "cargotrack-api"
