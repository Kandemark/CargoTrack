# CargoTrack SealedSecret — encrypted secrets safe to commit to git.
#
# HOW TO UPDATE SECRETS:
#
#   1. Create a temporary plain secret:
#      kubectl create secret generic cargotrack-secrets \
#        --namespace cargotrack \
#        --from-literal=DB_PASSWORD='...' \
#        --from-literal=SECRET_KEY='...' \
#        --from-literal=ENCRYPTION_KEY='...' \
#        --from-literal=WEBHOOK_SECRET_KEY='...' \
#        --from-literal=KEYCLOAK_ADMIN_PASSWORD='...' \
#        --dry-run=client -o yaml > /tmp/plain-secret.yaml
#
#   2. Seal it:
#      kubeseal --namespace cargotrack < /tmp/plain-secret.yaml > deploy/kubernetes/sealed-secrets/cargotrack-secrets.yaml
#
#   3. Delete the plain secret:
#      rm /tmp/plain-secret.yaml
#
#   4. Commit the updated sealed secret.
#
# The SealedSecrets controller will decrypt this into a regular Secret named
# "cargotrack-secrets" in the cargotrack namespace.
---
apiVersion: bitnami.com/v1
kind: SealedSecret
metadata:
  name: cargotrack-secrets
  namespace: cargotrack
  labels:
    app.kubernetes.io/part-of: cargotrack
spec:
  encryptedData:
    # Values below are pre-sealed for the target cluster.
    # To rotate, follow the instructions above.
    DB_PASSWORD: AgA...  # replace with kubeseal output
    SECRET_KEY: AgA...   # replace with kubeseal output
    ENCRYPTION_KEY: AgA...  # replace with kubeseal output
    REDIS_URL: AgA...    # replace with kubeseal output
    KAFKA_BROKERS: AgA...  # replace with kubeseal output
    KEYCLOAK_ADMIN_PASSWORD: AgA...  # replace with kubeseal output
    WEBHOOK_SECRET_KEY: AgA...  # replace with kubeseal output
  template:
    metadata:
      name: cargotrack-secrets
      namespace: cargotrack
      labels:
        app.kubernetes.io/part-of: cargotrack
    type: Opaque
