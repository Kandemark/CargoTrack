# CargoTrack Alertmanager — alert routing and notification channels
# ===================================================================
# Routes alerts from Prometheus rules to the appropriate channels.
# Severity-based routing: critical → PagerDuty, warning → Slack, info → email digest.

global:
  resolve_timeout: 5m

# ── Templates ──────────────────────────────────────────────────────────────
templates:
  - /etc/alertmanager/templates/cargotrack.tmpl

# ── Routing tree ───────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'slack-cargotrack-alerts'

  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-cargotrack'
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: 'slack-cargotrack-alerts'

    - match:
        severity: info
      receiver: 'email-digest'

# ── Receivers ──────────────────────────────────────────────────────────────
# Replace placeholder URLs/tokens with actual values in .env or K8s secrets.

receivers:
  - name: 'slack-cargotrack-alerts'
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '${SLACK_ALERT_CHANNEL}'
        title: '{{ template "slack.cargotrack.title" . }}'
        text: '{{ template "slack.cargotrack.text" . }}'
        send_resolved: true

  - name: 'pagerduty-cargotrack'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_ROUTING_KEY}'
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}error{{ end }}'
        description: '{{ .CommonAnnotations.description }}'

  - name: 'email-digest'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        from: '${ALERT_EMAIL_FROM}'
        smarthost: '${SMTP_HOST}:587'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '{{ template "email.cargotrack.subject" . }}'
        html: '{{ template "email.cargotrack.body" . }}'
        send_resolved: false

# ── Inhibition rules ───────────────────────────────────────────────────────
# Suppress lower-severity alerts when a higher-severity alert is already firing
# for the same service and alert name.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']

  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service']
